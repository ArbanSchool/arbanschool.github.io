<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Arban School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-6 md:p-12">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Заголовок -->
        <div class="flex items-center justify-between border-b border-slate-300 pb-5">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800">Управление Arban School</h1>
                <p class="text-slate-500 text-sm mt-1">Редактирование сайта и публикация в GitHub Pages</p>
            </div>
            <button onclick="saveConfigToGitHub()" id="save-btn" class="hidden bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg hover:shadow-sky-500/20 transition-all flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                Сохранить и опубликовать
            </button>
        </div>

        <!-- Уведомления -->
        <div id="status-message" class="hidden p-4 rounded-xl text-sm font-medium"></div>

        <!-- 0. Авторизация и подключение (Шаг 1) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-sky-600" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zm-2 4a5 5 0 00-4.546 2.916A5.986 5.986 0 0010 16a5.986 5.986 0 004.546-2.084A5 5 0 0010 11z" clip-rule="evenodd"/>
                </svg>
                Подключение к GitHub
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Репозиторий (URL или owner/repo)</label>
                    <input type="text" id="gh-repo" value="https://github.com/ArbanSchool/arbanschool.github.io/" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-mono text-slate-800 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">GitHub Personal Access Token (PAT)</label>
                    <input type="password" id="gh-token" placeholder="ghp_..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
            </div>
            <button onclick="fetchCurrentConfig()" id="load-btn" class="mt-4 bg-slate-800 hover:bg-slate-900 text-white font-semibold px-5 py-2.5 rounded-lg text-sm transition-all">
                Подключиться и загрузить данные
            </button>
        </div>

        <!-- ОСНОВНАЯ ФОРМА (Скрыта до авторизации) -->
        <div id="editor-form" class="hidden space-y-8">
            
            <!-- 1. Дизайн и цвет (Цветовая палитра) -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                    </svg>
                    Основной цвет оформления
                </h2>
                <div class="flex items-center gap-4 flex-wrap">
                    <select id="color-preset" onchange="applyColorPreset()" class="border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                        <option value="#0284c7">Sky Blue (Голубой)</option>
                        <option value="#2563eb">Royal Blue (Синий)</option>
                        <option value="#059669">Emerald (Изумрудный)</option>
                        <option value="#7c3aed">Purple (Фиолетовый)</option>
                        <option value="#dc2626">Red (Красный)</option>
                        <option value="#d97706">Amber (Янтарный)</option>
                        <option value="custom">Свой цвет...</option>
                    </select>
                    <input type="color" id="primary-color-picker" value="#0284c7" onchange="syncColorInput()" class="w-12 h-10 border border-slate-300 rounded-lg p-1 cursor-pointer">
                    <input type="text" id="primary-color-hex" value="#0284c7" readonly class="w-28 border border-slate-200 rounded-lg p-2 text-sm font-mono text-center text-slate-600 bg-slate-50">
                </div>
            </div>

            <!-- 2. Главный экран -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Заголовок и Логотип</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Название школы</label>
                        <input type="text" id="welcome-title" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Подзаголовок</label>
                        <input type="text" id="welcome-subtitle" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">URL Изображения логотипа</label>
                            <input type="text" id="logo-url" placeholder="1.png или https://..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Запасная буква логотипа</label>
                            <input type="text" id="logo-fallback" maxlength="2" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. Секция «О нас» -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800">Карточки «О нас»</h2>
                    <button onclick="addCard()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-lg transition-all">+ Добавить карточку</button>
                </div>
                <div id="cards-container" class="space-y-3"></div>
            </div>

            <!-- 4. Калькулятор цен -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Калькулятор цен (₽)</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Заголовок калькулятора</label>
                        <input type="text" id="calc-title" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                            <span class="font-bold text-slate-700 block text-sm border-b pb-2">Уроки 40 минут</span>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-slate-600">Индивидуально:</span>
                                <input type="number" id="price-ind-40" class="w-24 border border-slate-300 rounded p-1.5 text-right font-mono">
                            </div>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-slate-600">В парах:</span>
                                <input type="number" id="price-pair-40" class="w-24 border border-slate-300 rounded p-1.5 text-right font-mono">
                            </div>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-slate-600">Группа:</span>
                                <input type="number" id="price-group-40" class="w-24 border border-slate-300 rounded p-1.5 text-right font-mono">
                            </div>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                            <span class="font-bold text-slate-700 block text-sm border-b pb-2">Уроки 60 минут</span>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-slate-600">Индивидуально:</span>
                                <input type="number" id="price-ind-60" class="w-24 border border-slate-300 rounded p-1.5 text-right font-mono">
                            </div>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-slate-600">В парах:</span>
                                <input type="number" id="price-pair-60" class="w-24 border border-slate-300 rounded p-1.5 text-right font-mono">
                            </div>
                            <div class="flex items-center justify-between text-sm">
                                <span class="text-slate-600">Группа:</span>
                                <input type="number" id="price-group-60" class="w-24 border border-slate-300 rounded p-1.5 text-right font-mono">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5. Контакты -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4">Контакты</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Телефон</label>
                        <input type="text" id="contact-phone" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Адрес</label>
                        <input type="text" id="contact-address" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        const CONFIG_PATH = "site-config.json";
        let currentSha = null;

        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem("gh_pat_token");
            const savedRepo = localStorage.getItem("gh_repo_path");
            
            if (savedToken) document.getElementById("gh-token").value = savedToken;
            if (savedRepo) document.getElementById("gh-repo").value = savedRepo;
        });

        // Парсинг owner/repo из ввода пользователя
        function cleanRepoPath(input) {
            let str = input.trim().replace(/\/$/, "");
            if (str.includes("github.com/")) {
                str = str.split("github.com/")[1];
            }
            const parts = str.split("/").filter(Boolean);
            if (parts.length >= 2) {
                return `${parts[0]}/${parts[1]}`;
            }
            return str;
        }

        // Синхронизация палитры
        function applyColorPreset() {
            const val = document.getElementById("color-preset").value;
            if (val !== "custom") {
                document.getElementById("primary-color-picker").value = val;
                document.getElementById("primary-color-hex").value = val;
            }
        }

        function syncColorInput() {
            const color = document.getElementById("primary-color-picker").value;
            document.getElementById("primary-color-hex").value = color;
            document.getElementById("color-preset").value = "custom";
        }

        // Добавление элементов «О нас»
        function addCard(title = "", text = "") {
            const container = document.getElementById("cards-container");
            const div = document.createElement("div");
            div.className = "card-row flex gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-200";
            div.innerHTML = `
                <input type="text" placeholder="Заголовок" value="${title}" class="card-title-val w-1/3 border border-slate-300 rounded-lg p-2 text-sm">
                <input type="text" placeholder="Описание" value="${text}" class="card-text-val w-2/3 border border-slate-300 rounded-lg p-2 text-sm">
                <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 p-2 font-bold text-lg">&times;</button>
            `;
            container.appendChild(div);
        }

        // Загрузка конфига из GitHub API
        async function fetchCurrentConfig() {
            const token = document.getElementById("gh-token").value.trim();
            const rawRepo = document.getElementById("gh-repo").value;
            const repo = cleanRepoPath(rawRepo);

            if (!token) {
                showMessage("Пожалуйста, введите GitHub Personal Access Token (PAT)", "bg-amber-100 text-amber-800 border border-amber-300");
                return;
            }

            showMessage("Загрузка данных из GitHub...", "bg-blue-100 text-blue-800 border border-blue-300");

            try {
                const fileUrl = `https://api.github.com/repos/${repo}/contents/${CONFIG_PATH}`;
                const res = await fetch(fileUrl, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (!res.ok) {
                    if (res.status === 404) throw new Error("Файл site-config.json не найден в репозитории.");
                    if (res.status === 401) throw new Error("Неверный токен доступа (PAT).");
                    throw new Error(`Ошибка GitHub API: ${res.statusText}`);
                }

                const fileData = await res.json();
                currentSha = fileData.sha;

                // Декодируем UTF-8 из Base64
                const jsonText = new TextDecoder().decode(
                    Uint8Array.from(atob(fileData.content.replace(/\n/g, "")), c => c.charCodeAt(0))
                );
                const data = JSON.parse(jsonText);

                // Сохраняем учётку в localStorage
                localStorage.setItem("gh_pat_token", token);
                localStorage.setItem("gh_repo_path", rawRepo);

                // Заполняем поля
                const color = data.primary_color || "#0284c7";
                document.getElementById("primary-color-picker").value = color;
                document.getElementById("primary-color-hex").value = color;

                document.getElementById("welcome-title").value = data.welcome?.title || "";
                document.getElementById("welcome-subtitle").value = data.welcome?.subtitle || "";
                document.getElementById("logo-url").value = data.logo_url || "";
                document.getElementById("logo-fallback").value = data.logo_fallback_text || "A";

                document.getElementById("cards-container").innerHTML = "";
                if (data.about?.cards) {
                    data.about.cards.forEach(c => addCard(c.title, c.text));
                }

                document.getElementById("calc-title").value = data.calculator?.title || "Стоимость обучения";
                document.getElementById("price-ind-40").value = data.calculator?.price_individual_40 || 600;
                document.getElementById("price-pair-40").value = data.calculator?.price_pair_40 || 450;
                document.getElementById("price-group-40").value = data.calculator?.price_group_40 || 350;
                document.getElementById("price-ind-60").value = data.calculator?.price_individual_60 || 900;
                document.getElementById("price-pair-60").value = data.calculator?.price_pair_60 || 700;
                document.getElementById("price-group-60").value = data.calculator?.price_group_60 || 500;

                document.getElementById("contact-phone").value = data.contacts?.phone || "";
                document.getElementById("contact-address").value = data.contacts?.address || "";

                // Открываем форму и кнопку сохранения
                document.getElementById("editor-form").classList.remove("hidden");
                document.getElementById("save-btn").classList.remove("hidden");
                
                showMessage("Конфигурация успешно загружена! Теперь можно редактировать.", "bg-emerald-100 text-emerald-800 border border-emerald-300");

            } catch (err) {
                showMessage("Ошибка загрузки: " + err.message, "bg-red-100 text-red-800 border border-red-300");
            }
        }

        // Сборка объекта JSON
        function buildConfigObject() {
            const cards = [];
            document.querySelectorAll(".card-row").forEach(row => {
                cards.push({
                    title: row.querySelector(".card-title-val").value,
                    text: row.querySelector(".card-text-val").value
                });
            });

            return {
                primary_color: document.getElementById("primary-color-picker").value,
                site_title: document.getElementById("welcome-title").value + " - Школа английского языка",
                logo_url: document.getElementById("logo-url").value,
                logo_fallback_text: document.getElementById("logo-fallback").value,
                welcome: {
                    title: document.getElementById("welcome-title").value,
                    subtitle: document.getElementById("welcome-subtitle").value
                },
                about: { cards },
                calculator: {
                    title: document.getElementById("calc-title").value,
                    price_individual_40: parseInt(document.getElementById("price-ind-40").value) || 0,
                    price_pair_40: parseInt(document.getElementById("price-pair-40").value) || 0,
                    price_group_40: parseInt(document.getElementById("price-group-40").value) || 0,
                    price_individual_60: parseInt(document.getElementById("price-ind-60").value) || 0,
                    price_pair_60: parseInt(document.getElementById("price-pair-60").value) || 0,
                    price_group_60: parseInt(document.getElementById("price-group-60").value) || 0
                },
                contacts: {
                    phone: document.getElementById("contact-phone").value,
                    address: document.getElementById("contact-address").value
                }
            };
        }

        // Сохранение изменений в GitHub
        async function saveConfigToGitHub() {
            const token = document.getElementById("gh-token").value.trim();
            const rawRepo = document.getElementById("gh-repo").value;
            const repo = cleanRepoPath(rawRepo);
            const saveBtn = document.getElementById("save-btn");

            if (!token) {
                showMessage("Укажите GitHub PAT!", "bg-red-100 text-red-800 border border-red-300");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.classList.add("opacity-50");
            showMessage("Публикация изменений в GitHub...", "bg-blue-100 text-blue-800 border border-blue-300");

            try {
                const configObject = buildConfigObject();
                const jsonContent = JSON.stringify(configObject, null, 2);
                
                // Кодируем UTF-8 в Base64
                const bytes = new TextEncoder().encode(jsonContent);
                const binString = String.fromCharCode(...bytes);
                const base64Content = btoa(binString);

                const fileUrl = `https://api.github.com/repos/${repo}/contents/${CONFIG_PATH}`;
                
                const putBody = {
                    message: "Update site-config.json via Admin Panel",
                    content: base64Content,
                    branch: "main"
                };
                if (currentSha) putBody.sha = currentSha;

                const putRes = await fetch(fileUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(putBody)
                });

                if (!putRes.ok) {
                    const errData = await putRes.json();
                    throw new Error(errData.message || "Ошибка PUT-запроса");
                }

                const resData = await putRes.json();
                currentSha = resData.content.sha; // Обновляем sha на будущий commit

                showMessage("Успешно опубликовано! Изменения подтянутся на сайт в течение минуты.", "bg-emerald-100 text-emerald-800 border border-emerald-300");

            } catch (err) {
                showMessage("Ошибка сохранения: " + err.message, "bg-red-100 text-red-800 border border-red-300");
            } finally {
                saveBtn.disabled = false;
                saveBtn.classList.remove("opacity-50");
            }
        }

        function showMessage(text, classes) {
            const msgBox = document.getElementById("status-message");
            msgBox.className = `p-4 rounded-xl text-sm font-medium ${classes}`;
            msgBox.innerText = text;
            msgBox.classList.remove("hidden");
        }
    </script>
</body>
</html>
