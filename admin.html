<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Arban School</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">🎛️ Админ-панель сайта</h1>

        <!-- Блок подключения к GitHub -->
        <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">📁 Подключение к GitHub</h2>
            <div class="grid gap-4 md:grid-cols-2">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Personal Access Token (PAT)</label>
                    <input type="password" id="gh-token" placeholder="ghp_..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Репозиторий (owner/repo)</label>
                    <input type="text" id="gh-repo" placeholder="username/repo-name" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            <button onclick="fetchCurrentConfig()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors">
                📥 Загрузить конфигурацию
            </button>
        </div>

        <!-- Статус сообщения -->
        <div id="status-message" class="hidden mb-6"></div>

        <!-- Форма редактора (скрыта до загрузки конфига) -->
        <form id="editor-form" class="hidden space-y-8">
            
            <!-- Основные настройки -->
            <section class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">🎨 Основные настройки</h3>
                <div class="grid gap-4 md:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Основной цвет</label>
                        <div class="flex gap-2">
                            <input type="color" id="primary-color-picker" value="#0284c7" class="w-12 h-10 border border-slate-300 rounded-lg cursor-pointer" onchange="syncColorInput()">
                            <input type="text" id="primary-color-hex" value="#0284c7" class="flex-1 border border-slate-300 rounded-lg p-2 text-sm" onchange="document.getElementById('primary-color-picker').value = this.value; document.getElementById('color-preset').value = 'custom'">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">URL логотипа</label>
                        <input type="text" id="logo-url" placeholder="logo.png" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Текст логотипа (если нет картинки)</label>
                        <input type="text" id="logo-fallback" value="A" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                </div>
            </section>

            <!-- Приветственный блок -->
            <section class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">👋 Приветственный блок</h3>
                <div class="grid gap-4 md:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Заголовок</label>
                        <input type="text" id="welcome-title" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Подзаголовок</label>
                        <input type="text" id="welcome-subtitle" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                </div>
            </section>

            <!-- Карточки "О нас" -->
            <section class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">📇 Карточки "О нас"</h3>
                <div id="cards-container" class="space-y-3 mb-4"></div>
                <button type="button" onclick="addCard()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm">
                    ➕ Добавить карточку
                </button>
            </section>

            <!-- Калькулятор -->
            <section class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">🧮 Калькулятор стоимости</h3>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Заголовок калькулятора</label>
                    <input type="text" id="calc-title" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                </div>
                
                <h4 class="font-medium text-gray-600 mb-3">Индивидуальные занятия</h4>
                <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-4 mb-6">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">1 ученик, 40 мин</label>
                        <input type="number" id="price-ind-40-1" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">2 ученика, 40 мин</label>
                        <input type="number" id="price-ind-40-2" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">1 ученик, 60 мин</label>
                        <input type="number" id="price-ind-60-1" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">2 ученика, 60 мин</label>
                        <input type="number" id="price-ind-60-2" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                </div>

                <h4 class="font-medium text-gray-600 mb-3">Разовые занятия</h4>
                <div class="grid gap-3 md:grid-cols-2 mb-6">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">40 минут</label>
                        <input type="number" id="price-single-40" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">60 минут</label>
                        <input type="number" id="price-single-60" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                </div>

                <h4 class="font-medium text-gray-600 mb-3">Групповые занятия</h4>
                <div class="grid gap-3 md:grid-cols-2">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">1 группа (до 4 чел)</label>
                        <input type="number" id="price-group-1" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">2 группа (до 8 чел)</label>
                        <input type="number" id="price-group-2" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                </div>
            </section>

            <!-- Контакты -->
            <section class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                <h3 class="text-lg font-semibold text-gray-700 mb-4">📞 Контакты</h3>
                <div class="grid gap-4 md:grid-cols-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Телефон</label>
                        <input type="text" id="contact-phone" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Адрес</label>
                        <input type="text" id="contact-address" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                </div>
            </section>

            <!-- Кнопка сохранения -->
            <button type="button" id="save-btn" onclick="saveConfigToGitHub()" class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-xl transition-colors text-lg">
                💾 Сохранить изменения в GitHub
            </button>
        </form>
    </div>

    <script>
        const CONFIG_PATH = "site-config.json";
        let currentSha = null;

        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem("gh_pat_token");
            const savedRepo = localStorage.getItem("gh_repo_path");
            
            if (savedToken) document.getElementById("gh-token").value = savedToken;
            if (savedRepo) document.getElementById("gh-repo").value = savedRepo;
        });

        // Парсинг owner/repo из ввода пользователя
        function cleanRepoPath(input) {
            let str = input.trim().replace(/\/$/, "");
            if (str.includes("github.com/")) {
                str = str.split("github.com/")[1];
            }
            const parts = str.split("/").filter(Boolean);
            if (parts.length >= 2) {
                return `${parts[0]}/${parts[1]}`;
            }
            return str;
        }

        // Синхронизация палитры
        function syncColorInput() {
            const color = document.getElementById("primary-color-picker").value;
            document.getElementById("primary-color-hex").value = color;
        }

        // Добавление элементов «О нас»
        function addCard(title = "", text = "") {
            const container = document.getElementById("cards-container");
            const div = document.createElement("div");
            div.className = "card-row flex gap-2 items-center bg-white p-3 rounded-lg border border-slate-300";
            div.innerHTML = `
                <input type="text" placeholder="Заголовок" value="${escapeHtml(title)}" class="card-title-val w-1/3 border border-slate-300 rounded-lg p-2 text-sm" required>
                <input type="text" placeholder="Описание" value="${escapeHtml(text)}" class="card-text-val w-2/3 border border-slate-300 rounded-lg p-2 text-sm">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 p-2 font-bold text-lg">&times;</button>
            `;
            container.appendChild(div);
        }

        // Экранирование HTML
        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        // Загрузка конфига из GitHub API
        async function fetchCurrentConfig() {
            const token = document.getElementById("gh-token").value.trim();
            const rawRepo = document.getElementById("gh-repo").value;
            const repo = cleanRepoPath(rawRepo);

            if (!token) {
                showMessage("Пожалуйста, введите GitHub Personal Access Token (PAT)", "bg-amber-100 text-amber-800 border border-amber-300");
                return;
            }

            showMessage("Загрузка данных из GitHub...", "bg-blue-100 text-blue-800 border border-blue-300");

            try {
                const fileUrl = `https://api.github.com/repos/${repo}/contents/${CONFIG_PATH}`;
                const res = await fetch(fileUrl, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (!res.ok) {
                    if (res.status === 404) throw new Error("Файл site-config.json не найден в репозитории.");
                    if (res.status === 401) throw new Error("Неверный токен доступа (PAT).");
                    throw new Error(`Ошибка GitHub API: ${res.statusText}`);
                }

                const fileData = await res.json();
                currentSha = fileData.sha;

                // Декодируем UTF-8 из Base64
                const jsonText = new TextDecoder().decode(
                    Uint8Array.from(atob(fileData.content.replace(/\n/g, "")), c => c.charCodeAt(0))
                );
                const data = JSON.parse(jsonText);

                // Сохраняем учётку в localStorage
                localStorage.setItem("gh_pat_token", token);
                localStorage.setItem("gh_repo_path", rawRepo);

                // Заполняем поля
                document.getElementById("primary-color-picker").value = data.primary_color || "#0284c7";
                document.getElementById("primary-color-hex").value = data.primary_color || "#0284c7";

                document.getElementById("welcome-title").value = data.welcome?.title || "";
                document.getElementById("welcome-subtitle").value = data.welcome?.subtitle || "";
                document.getElementById("logo-url").value = data.logo_url || "";
                document.getElementById("logo-fallback").value = data.logo_fallback_text || "A";

                document.getElementById("cards-container").innerHTML = "";
                if (data.about?.cards && Array.isArray(data.about.cards)) {
                    data.about.cards.forEach(c => addCard(c.title, c.text));
                }

                // Калькулятор - новая структура с prices
                document.getElementById("calc-title").value = data.calculator?.title || "Рассчитать стоимость";
                
                const prices = data.calculator?.prices || {};
                
                // Индивидуальные
                document.getElementById("price-ind-40-1").value = prices.individual_40_1 ?? 800;
                document.getElementById("price-ind-40-2").value = prices.individual_40_2 ?? 750;
                document.getElementById("price-ind-60-1").value = prices.individual_60_1 ?? 1200;
                document.getElementById("price-ind-60-2").value = prices.individual_60_2 ?? 1100;
                
                // Разовые
                document.getElementById("price-single-40").value = prices.single_40 ?? 900;
                document.getElementById("price-single-60").value = prices.single_60 ?? 1350;
                
                // Групповые
                document.getElementById("price-group-1").value = prices.group_1 ?? 450;
                document.getElementById("price-group-2").value = prices.group_2 ?? 400;

                document.getElementById("contact-phone").value = data.contacts?.phone || "";
                document.getElementById("contact-address").value = data.contacts?.address || "";

                // Открываем форму и кнопку сохранения
                document.getElementById("editor-form").classList.remove("hidden");
                document.getElementById("save-btn").classList.remove("hidden");
                
                showMessage("Конфигурация успешно загружена! Теперь можно редактировать.", "bg-emerald-100 text-emerald-800 border border-emerald-300");

            } catch (err) {
                showMessage("Ошибка загрузки: " + err.message, "bg-red-100 text-red-800 border border-red-300");
            }
        }

        // Сборка объекта JSON
        function buildConfigObject() {
            const cards = [];
            document.querySelectorAll(".card-row").forEach(row => {
                const titleVal = row.querySelector(".card-title-val").value.trim();
                const textVal = row.querySelector(".card-text-val").value.trim();
                if (titleVal) {
                    cards.push({
                        title: titleVal,
                        text: textVal
                    });
                }
            });

            return {
                primary_color: document.getElementById("primary-color-picker").value,
                site_title: document.getElementById("welcome-title").value + " - Школа английского языка",
                logo_url: document.getElementById("logo-url").value,
                logo_fallback_text: document.getElementById("logo-fallback").value,
                welcome: {
                    title: document.getElementById("welcome-title").value,
                    subtitle: document.getElementById("welcome-subtitle").value
                },
                about: { cards },
                calculator: {
                    title: document.getElementById("calc-title").value,
                    prices: {
                        individual_40_1: parseInt(document.getElementById("price-ind-40-1").value) || 0,
                        individual_40_2: parseInt(document.getElementById("price-ind-40-2").value) || 0,
                        individual_60_1: parseInt(document.getElementById("price-ind-60-1").value) || 0,
                        individual_60_2: parseInt(document.getElementById("price-ind-60-2").value) || 0,
                        single_40: parseInt(document.getElementById("price-single-40").value) || 0,
                        single_60: parseInt(document.getElementById("price-single-60").value) || 0,
                        group_1: parseInt(document.getElementById("price-group-1").value) || 0,
                        group_2: parseInt(document.getElementById("price-group-2").value) || 0
                    }
                },
                contacts: {
                    phone: document.getElementById("contact-phone").value,
                    address: document.getElementById("contact-address").value
                }
            };
        }

        // Сохранение изменений в GitHub
        async function saveConfigToGitHub() {
            const token = document.getElementById("gh-token").value.trim();
            const rawRepo = document.getElementById("gh-repo").value;
            const repo = cleanRepoPath(rawRepo);
            const saveBtn = document.getElementById("save-btn");

            if (!token) {
                showMessage("Укажите GitHub PAT!", "bg-red-100 text-red-800 border border-red-300");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.classList.add("opacity-50");
            showMessage("Публикация изменений в GitHub...", "bg-blue-100 text-blue-800 border border-blue-300");

            try {
                const configObject = buildConfigObject();
                const jsonContent = JSON.stringify(configObject, null, 2);
                
                // Кодируем UTF-8 в Base64
                const bytes = new TextEncoder().encode(jsonContent);
                const binString = String.fromCharCode(...bytes);
                const base64Content = btoa(binString);

                const fileUrl = `https://api.github.com/repos/${repo}/contents/${CONFIG_PATH}`;
                
                const putBody = {
                    message: "Update site-config.json via Admin Panel",
                    content: base64Content,
                    branch: "main"
                };
                if (currentSha) putBody.sha = currentSha;

                const putRes = await fetch(fileUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(putBody)
                });

                if (!putRes.ok) {
                    const errData = await putRes.json();
                    throw new Error(errData.message || "Ошибка PUT-запроса");
                }

                const resData = await putRes.json();
                currentSha = resData.content.sha;

                showMessage("✅ Успешно опубликовано! Изменения подтянутся на сайт в течение минуты.", "bg-emerald-100 text-emerald-800 border border-emerald-300");

            } catch (err) {
                showMessage("Ошибка сохранения: " + err.message, "bg-red-100 text-red-800 border border-red-300");
            } finally {
                saveBtn.disabled = false;
                saveBtn.classList.remove("opacity-50");
            }
        }

        function showMessage(text, classes) {
            const msgBox = document.getElementById("status-message");
            msgBox.className = `p-4 rounded-xl text-sm font-medium ${classes}`;
            msgBox.innerText = text;
            msgBox.classList.remove("hidden");
        }
    </script>
</body>
</html>
